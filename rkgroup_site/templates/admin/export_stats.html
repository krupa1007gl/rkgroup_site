{% extends "admin/base_site.html" %}

{% block content %}
<div style="max-width: 500px; margin: 40px auto; padding: 30px; background: white; border-radius: 12px;">
    <h1>Экспорт статистики посещений</h1>
    <form method="post" style="margin-top: 30px;">
        {% csrf_token %}
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 10px; font-weight: bold;">Период:</label>
            <div style="margin-bottom: 10px;">
                <input type="radio" name="period" value="day" id="day" checked>
                <label for="day">За последние 24 часа</label>
            </div>
            <div style="margin-bottom: 10px;">
                <input type="radio" name="period" value="week" id="week">
                <label for="week">За последнюю неделю</label>
            </div>
            <div style="margin-bottom: 10px;">
                <input type="radio" name="period" value="month" id="month">
                <label for="month">За последний месяц</label>
            </div>
        </div>
        <button type="submit" style="background: #417690; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">
            Скачать статистику в Excel
        </button>
    </form>
    <p style="margin-top: 30px; color: #666; font-size: 12px;">
        Статистика собирается с момента установки middleware.
    </p>
</div>
{% endblock %}
